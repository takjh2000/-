services:
  - type: web
    name: boardgame-rental-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: printf '%s' "$AIVEN_CA_CERT" > /tmp/aiven-ca.pem && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
